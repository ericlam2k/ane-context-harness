# Default ignore / exclusion rules for repository indexing.
# Matched against normalized relative paths.
global_excludes:
  - ".git"
  - "node_modules"
  - ".venv"
  - "venv"
  - "__pycache__"
  - ".tox"
  - ".mypy_cache"
  - ".pytest_cache"
  - ".cache"
  - "dist"
  - "build"
  - "*.egg-info"
  - ".DS_Store"
  - ".localized"

ignored_extensions:
  - ".png"
  - ".jpg"
  - ".jpeg"
  - ".gif"
  - ".ico"
  - ".pdf"
  - ".zip"
  - ".tar"
  - ".gz"
  - ".so"
  - ".dylib"
  - ".o"
  - ".class"
  - ".jar"
  - ".wasm"
  - ".mp4"
  - ".mp3"
  - ".woff"
  - ".woff2"

allowed_extensions:
  source:
    - ".py"
    - ".pyi"
    - ".js"
    - ".ts"
    - ".jsx"
    - ".tsx"
    - ".c"
    - ".h"
    - ".cpp"
    - ".cc"
    - ".m"
    - ".mm"
    - ".rs"
    - "*.go"
    - "*.java"
    - "*.rb"
    - "*.sh"
  docs:
    - ".md"
    - ".rst"
    - ".txt"
