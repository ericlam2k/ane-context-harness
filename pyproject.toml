[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ane-context-harness"
version = "0.1.0a1"
description = "Generation-neutral local context-intelligence harness for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
  "tiktoken>=0.7; platform_machine != 'arm64'",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7"]
test = ["pytest>=7.4"]
mcp = ["mcp[cli]>=1.0,<2"]

[project.scripts]
ane-harness = "ane_context_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ane_context_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
